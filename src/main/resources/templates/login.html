<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Application Sécurisée</title>
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif;
               background: linear-gradient(135deg, #1e3a5f 0%, #2b5797 100%);
               margin: 0; min-height: 100vh; display: flex;
               align-items: center; justify-content: center; }
        .login-box { background: #fff; padding: 32px 34px; border-radius: 10px;
                     width: 340px; box-shadow: 0 16px 40px rgba(0,0,0,0.28); }
        .login-box h2 { margin: 0 0 6px; color: #1f2937; }
        .login-box p.sub { margin: 0 0 18px; color: #6b7280; font-size: 0.9rem; }
        label { display: block; text-align: left; font-size: 0.88rem;
                color: #374151; margin: 12px 0 4px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc;
                border-radius: 6px; font-size: 0.95rem; }
        input:focus { outline: 2px solid #2b5797; border-color: transparent; }
        button { width: 100%; margin-top: 18px; padding: 11px; border: none;
                 border-radius: 6px; background: #2b5797; color: #fff;
                 font-size: 0.98rem; font-weight: 600; cursor: pointer; }
        button:hover { filter: brightness(1.08); }
        p.error { color: #b91c1c; font-size: 0.9rem; margin-top: 14px; }
        p.logout { color: #15803d; font-size: 0.9rem; margin-top: 14px; }
        .hint { margin-top: 18px; font-size: 0.82rem; color: #9ca3af; }
        code { background: #f1f5f9; padding: 2px 6px; border-radius: 5px; color: #334155; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Authentification</h2>
        <p class="sub">Accès réservé &mdash; identifiez-vous pour continuer.</p>

        <form th:action="@{/authenticate}" method="post">
            <label for="username">Nom d'utilisateur :</label>
            <input type="text" id="username" name="username"
                   placeholder="Saisir le nom d'utilisateur" required autofocus>

            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password"
                   placeholder="Mot de passe" required>

            <button type="submit">Se connecter</button>
        </form>

        <p th:if="${param.error}" class="error">Identifiants incorrects, veuillez réessayer.</p>
        <p th:if="${param.logout}" class="logout">Vous êtes déconnecté avec succès.</p>

        <p class="hint">Comptes de test : <code>user / 1111</code> &middot; <code>admin / 1234</code></p>
    </div>
</body>
</html>
