<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès refusé (403)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="card">
        <span class="role-tag role-err">Erreur 403</span>
        <h2>Accès refusé</h2>
        <p>Vous êtes authentifié, mais votre rôle ne vous autorise pas à consulter
           cette page. L'espace demandé exige un rôle supérieur (par exemple
           <strong>ADMIN</strong>).</p>

        <div class="actions">
            <a class="btn btn-primary" th:href="@{/home}">Retour à l'accueil</a>
            <form class="inline" th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-ghost">Changer de compte</button>
            </form>
        </div>
    </div>
</body>
</html>
